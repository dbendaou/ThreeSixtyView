name: CI

on:
  push:
  pull_request:

jobs:
  projection:
    name: Self-test (Linux)
    # ubuntu-latest is 26.04, which swift-actions/setup-swift@v2 does not support.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Build ProjectionMath and SpatialMedia
        run: |
          swift build --target ProjectionMath
          swift build --target SpatialMedia
      - name: Projection and spatial checks
        run: swift run PortableChecks

  macos:
    name: Build and round trip (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift
        run: swift --version
      - name: Build
        run: swift build
      - name: Full self-test, including AVFoundation and Metal
        run: swift run ThreeSixtyView --self-test
      - name: Release build
        run: swift build -c release
