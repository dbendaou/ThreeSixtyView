name: CI

on:
  push:
  pull_request:

jobs:
  projection:
    name: Self-test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Build
        run: swift build
      - name: Projection, metadata, and fixture checks
        run: swift run ThreeSixtyView --self-test

  macos:
    name: Build and round trip (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift
        run: swift --version
      - name: Build
        run: swift build
      - name: Full self-test, including AVFoundation and Metal
        run: swift run ThreeSixtyView --self-test
      - name: Release build
        run: swift build -c release
